<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mario Montecatine</title>
    <meta name="description" content="De la ciudad de la Alhambra. He estudiado Ingeniería en Telecomunicaciones en la UGR. Ahora construyo *****, un dispositivo para recuperar la atención." />
    <meta property="og:title" content="Mario Montecatine" />
    <meta property="og:description" content="De la ciudad de la Alhambra. He estudiado Ingeniería en Telecomunicaciones en la UGR. Ahora construyo *****, un dispositivo para recuperar la atención." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mariomontecatine.github.io/" />
    <meta property="og:image" content="https://mariomontecatine.github.io/assets/portrait.jpg" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#fbfbfa" />
    <link rel="canonical" href="https://mariomontecatine.github.io/" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='%23101010'><circle cx='26' cy='26' r='10'/><circle cx='74' cy='26' r='10'/><circle cx='50' cy='50' r='10'/><circle cx='26' cy='74' r='10'/><circle cx='74' cy='74' r='10'/></g></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="preload" href="assets/portrait-dots-light.png" as="image" media="(prefers-color-scheme: light)" />
    <link rel="preload" href="assets/portrait-dots-dark.png" as="image" media="(prefers-color-scheme: dark)" />
    <script>
      // El tema, antes del primer pintado, para que no haya destello.
      try {
        var saved = localStorage.getItem('mm-theme');
        if (saved !== 'dark' && saved !== 'light') {
          saved = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = saved;
        var lang = localStorage.getItem('mm-lang');
        document.documentElement.lang = lang === 'en' ? 'en' : 'es';
      } catch (e) {}
    </script>
    <style>
      :root {
        --paper: #fbfbfa;
        --halo: #ffffff;
        --rim: #f2f2f0;
        --ink: #101010;
        --ink-soft: #5c5c58;
        --ink-faint: #a3a39d;
        --rule: #e8e8e5;
        --gutter: clamp(20px, 4vw, 60px);
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        --paper: #0e0e0f;
        --halo: #1a1a1d;
        --rim: #0a0a0b;
        --ink: #f3f1ec;
        --ink-soft: #a09e98;
        --ink-faint: #6a6863;
        --rule: #232326;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }

      body {
        /* Una luz de estudio detrás de los puntos, que se apaga hacia los bordes. */
        background: radial-gradient(ellipse 72% 68% at 50% 44%, var(--halo) 0%, var(--paper) 58%, var(--rim) 100%) var(--paper);
        color: var(--ink);
        font: 16px/1.6 Geist, system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none;
        transition: background-color 0.4s, color 0.4s;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      ::selection {
        background: var(--ink);
        color: var(--paper);
      }

      :focus-visible {
        outline: 1.5px solid var(--ink);
        outline-offset: 4px;
        border-radius: 3px;
      }

      #stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none;
      }

      /* ---- Los dos botones de arriba a la derecha ---- */

      .controls {
        position: fixed;
        z-index: 3;
        top: 18px;
        right: var(--gutter);
        display: flex;
        gap: 8px;
      }

      .controls button {
        height: 36px;
        min-width: 36px;
        padding: 0 11px;
        display: grid;
        place-items: center;
        font: 500 12px/1 Geist, system-ui, sans-serif;
        letter-spacing: 0.06em;
        color: var(--ink-soft);
        background: transparent;
        border: 1px solid var(--rule);
        border-radius: 999px;
        cursor: pointer;
        transition: color 0.2s, border-color 0.2s;
      }

      .controls button:hover {
        color: var(--ink);
        border-color: var(--ink-faint);
      }

      .controls svg {
        width: 15px;
        height: 15px;
      }

      #theme .sun,
      :root[data-theme='dark'] #theme .moon {
        display: none;
      }

      :root[data-theme='dark'] #theme .sun {
        display: block;
      }

      /* ---- Rejilla principal: quién soy / los puntos / el índice ---- */

      .page {
        position: relative;
        z-index: 1;
        height: 100vh;
        height: 100svh;
        display: grid;
        grid-template-columns: minmax(250px, 22rem) minmax(0, 1fr) minmax(290px, 23rem);
        gap: 24px;
        align-items: center;
        padding: 40px var(--gutter);
      }

      h1 {
        margin: 0;
        font-weight: 600;
        font-size: clamp(2.4rem, 1.1rem + 2.9vw, 4.2rem);
        line-height: 1;
        letter-spacing: -0.045em;
      }

      .greet {
        display: block;
        margin-bottom: 12px;
        font-size: 14px;
        font-weight: 400;
        line-height: 1.6;
        letter-spacing: 0;
        color: var(--ink-faint);
      }

      .bio p {
        margin: 22px 0 0;
        max-width: 21rem;
        color: var(--ink-soft);
        font-size: 15.5px;
        line-height: 1.55;
        text-wrap: pretty;
      }

      .bio p + p {
        margin-top: 11px;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        margin-top: 26px;
        font-size: 14px;
        font-weight: 500;
      }

      .links a {
        display: inline-flex;
        gap: 4px;
        padding: 2px 0;
        border-bottom: 1px solid var(--rule);
        transition: border-color 0.2s;
      }

      .links a::after {
        content: '↗';
        color: var(--ink-faint);
        font-weight: 400;
      }

      .links a[data-mail]::after {
        content: '→';
      }

      .links a:hover {
        border-color: var(--ink);
      }

      /* ---- La columna del medio sólo sujeta el pie de foto ---- */

      .slot {
        position: relative;
        align-self: stretch;
        min-height: 0;
      }

      .caption {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 2px;
        margin: 0 auto;
        max-width: 30rem;
        padding: 0 12px;
        min-height: 4.8em;
        text-align: center;
        font-size: 14px;
        line-height: 1.5;
        color: var(--ink-soft);
      }

      .caption b {
        display: block;
        margin-bottom: 2px;
        font-size: 13px;
        font-weight: 500;
        color: var(--ink);
      }

      .caption.in {
        animation: rise 0.45s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }

      .hint-touch {
        display: none;
      }

      @media (hover: none) {
        .hint-touch {
          display: inline;
        }
        .hint-mouse {
          display: none;
        }
      }

      /* ---- El índice: pestañas y listas ---- */

      .index {
        justify-self: end;
        width: 100%;
      }

      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 18px;
        margin-bottom: 12px;
      }

      .tabs button {
        position: relative;
        padding: 4px 0;
        font: 500 14px/1.5 Geist, system-ui, sans-serif;
        color: var(--ink-faint);
        background: none;
        border: 0;
        cursor: pointer;
        transition: color 0.2s;
      }

      .tabs button sup {
        margin-left: 2px;
        font-size: 10px;
        font-weight: 400;
        font-variant-numeric: tabular-nums;
      }

      .tabs button::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: -2px;
        height: 1.5px;
        background: var(--ink);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.3s cubic-bezier(0.2, 0.7, 0.2, 1);
      }

      .tabs button:hover {
        color: var(--ink-soft);
      }

      .tabs button[aria-selected='true'] {
        color: var(--ink);
      }

      .tabs button[aria-selected='true']::after {
        transform: none;
      }

      /* Las listas comparten celda: cambiar de pestaña no mueve la columna. */
      .panels {
        display: grid;
      }

      .panels > ol {
        grid-area: 1 / 1;
        transition: opacity 0.3s, visibility 0.3s;
      }

      .panels > ol[hidden] {
        display: block;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      ol.list {
        margin: 0;
        padding: 0;
        list-style: none;
        align-self: start;
        border-bottom: 1px solid var(--rule);
      }

      ol.list li {
        border-top: 1px solid var(--rule);
      }

      .row {
        width: 100%;
        margin: 0;
        padding: clamp(8px, 1.4vh, 13px) 0;
        display: grid;
        grid-template-columns: 2rem 1fr auto 0.9rem;
        align-items: baseline;
        gap: 8px;
        text-align: left;
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: pointer;
        transition: opacity 0.25s;
      }

      .row .no {
        font-size: 12px;
        color: var(--ink-faint);
        font-variant-numeric: tabular-nums;
      }

      .row .name {
        font-size: 16.5px;
        font-weight: 500;
        letter-spacing: -0.015em;
        line-height: 1.3;
      }

      .row .tag {
        font-size: 13px;
        color: var(--ink-faint);
      }

      .row .go {
        font-size: 13px;
        opacity: 0;
        transform: translate(-4px, 2px);
        transition: opacity 0.2s, transform 0.25s;
      }

      ol.list.live .row {
        opacity: 0.32;
      }

      ol.list.live .row.on {
        opacity: 1;
      }

      .row.on .go,
      .row:focus-visible .go {
        opacity: 1;
        transform: none;
      }

      .foot {
        position: fixed;
        left: var(--gutter);
        bottom: 22px;
        margin: 0;
        font-size: 12.5px;
        color: var(--ink-faint);
      }

      /* ---- Pantallas estrechas: se apila ---- */

      @media (max-width: 880px) {
        .page {
          grid-template-columns: 1fr;
          grid-template-rows: auto minmax(0, 1fr) auto;
          gap: 8px;
          align-items: stretch;
          padding: max(18px, env(safe-area-inset-top)) 20px max(54px, calc(env(safe-area-inset-bottom) + 46px));
        }
        h1 {
          font-size: clamp(2rem, 1.2rem + 4vw, 2.7rem);
        }
        .greet {
          margin-bottom: 6px;
          font-size: 13px;
        }
        .bio p {
          margin-top: 12px;
          font-size: 14px;
          max-width: 32rem;
        }
        .links {
          margin-top: 14px;
          font-size: 13px;
          gap: 16px;
        }
        .caption {
          bottom: 0;
          font-size: 13px;
          min-height: 3.4em;
        }
        .index {
          justify-self: stretch;
          /* Pegada abajo: el hueco que sobra se lo queda el retrato. */
          align-self: end;
        }
        .tabs {
          margin-bottom: 6px;
          gap: 4px 14px;
        }
        .tabs button {
          font-size: 13px;
        }
        ol.list {
          display: grid;
          grid-template-columns: 1fr 1fr;
          column-gap: 16px;
          border-bottom: 0;
        }
        ol.list li:nth-last-child(-n + 2) {
          border-bottom: 1px solid var(--rule);
        }
        .row {
          grid-template-columns: 1.3rem 1fr;
          gap: 2px;
          padding: 9px 0;
        }
        .row .name {
          font-size: 13.5px;
          line-height: 1.25;
        }
        .row .no {
          font-size: 11px;
        }
        .row .tag,
        .row .go {
          display: none;
        }
        .controls {
          top: auto;
          bottom: max(14px, env(safe-area-inset-bottom));
          right: 20px;
        }
        .foot {
          left: 20px;
          bottom: max(24px, calc(env(safe-area-inset-bottom) + 10px));
        }
      }

      @media (max-width: 880px) and (max-height: 720px) {
        .bio p {
          font-size: 13px;
          margin-top: 8px;
        }
        .bio p + p {
          display: none;
        }
        .links {
          margin-top: 10px;
        }
      }

      @media (max-width: 880px) and (max-height: 620px) {
        .bio {
          display: none;
        }
      }

      @media (min-width: 881px) and (max-height: 640px) {
        .bio p + p {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .caption.in {
          animation: none;
        }
      }

      noscript .fallback {
        position: fixed;
        inset: 0;
        z-index: 5;
        overflow: auto;
        padding: 40px var(--gutter);
        background: var(--paper);
      }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-hidden="true"></canvas>

    <div class="controls">
      <button id="lang" type="button" aria-label="Switch to English">EN</button>
      <button id="theme" type="button" aria-label="Cambiar a modo oscuro" aria-pressed="false">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z" />
        </svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4" />
        </svg>
      </button>
    </div>

    <main class="page">
      <header class="who">
        <h1><span class="greet" id="greet"></span> <span id="first"></span></h1>
        <div class="bio" id="bio"></div>
        <nav class="links" id="links" aria-label="Contacto"></nav>
      </header>

      <div class="slot">
        <p class="caption" id="caption" aria-live="polite"></p>
      </div>

      <section class="index" id="index">
        <div class="tabs" id="tabs" role="tablist"></div>
        <div class="panels" id="panels"></div>
      </section>
    </main>

    <p class="foot" id="foot"></p>

    <noscript>
      <div class="fallback">
        <h1>Mario Montecatine</h1>
        <p>De la ciudad de la Alhambra. He estudiado Ingeniería en Telecomunicaciones en la UGR. Ahora construyo *****, un dispositivo para recuperar la atención.</p>
        <p>
          <a href="https://github.com/mariomontecatine">GitHub</a> ·
          <a href="https://es.linkedin.com/in/mariomontecatine">LinkedIn</a> ·
          <a href="mailto:mario@focco.app">mario@focco.app</a>
        </p>
      </div>
    </noscript>

    <script type="module" src="main.js"></script>
  </body>
</html>
