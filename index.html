<!doctype html>
<html lang="es" class="intro-on">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mario Montecatine</title>
    <meta name="description" content="Ingeniero en Telecomunicaciones por la UGR, de Granada. Creador de *****." />
    <meta property="og:title" content="Mario Montecatine" />
    <meta property="og:description" content="De la ciudad de la Alhambra. He estudiado Ingeniería en Telecomunicaciones en la UGR. Ahora construyo *****, un dispositivo para recuperar la atención." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mariomontecatine.github.io/" />
    <meta property="og:image" content="https://mariomontecatine.github.io/assets/portrait.jpg" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#000000" />
    <link rel="canonical" href="https://mariomontecatine.github.io/" />
    <!-- El logo en negro con la pestaña clara y en blanco con la oscura. -->
    <link rel="icon" type="image/png" href="assets/favicon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="assets/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Geist:wght@400;500;800&display=swap" rel="stylesheet" />
    <link rel="preload" href="assets/portrait-dots-dark.png" as="image" />
    <script>
      try {
        var lang = localStorage.getItem('mm-lang');
        document.documentElement.lang = lang === 'en' ? 'en' : 'es';
      } catch (e) {}
    </script>
    <style>
      :root {
        /* Márgenes de la web de Jeremy: 24 px, y 128 px en pantallas muy anchas. */
        --gutter: 24px;
        --bg: #000;
        --ink: #fff;
        --ink-soft: rgba(255, 255, 255, 0.6);
        --ink-faint: rgba(255, 255, 255, 0.38);
        --rule: rgba(255, 255, 255, 0.16);
        --sans: Geist, system-ui, -apple-system, 'Segoe UI', sans-serif;
        --mono: 'DM Mono', ui-monospace, 'SF Mono', Menlo, monospace;
        --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      html.intro-on,
      html.intro-on body {
        overflow: hidden;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 400 16px/1.6 var(--sans);
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button {
        font: inherit;
        color: inherit;
      }

      ::selection {
        background: var(--ink);
        color: var(--bg);
      }

      :focus-visible {
        outline: 1.5px solid var(--ink);
        outline-offset: 4px;
        border-radius: 2px;
      }

      .mono {
        font-family: var(--mono);
        font-size: 13.6px;
        line-height: 1.5;
        text-transform: uppercase;
      }

      /* ---- La entrada ---- */

      .intro {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: var(--bg);
      }

      .intro p {
        margin: 0;
        padding: 0 20px;
        font-size: 22px;
        line-height: 1.3;
        text-align: center;
        opacity: 0;
        will-change: transform, opacity, filter;
      }

      .intro-dust {
        position: fixed;
        pointer-events: none;
      }

      /* Mientras dura la intro, lo que luego entra animado espera escondido. */
      html.intro-on .top,
      html.intro-on .statement,
      html.intro-on .clock,
      html.intro-on .cta,
      html.intro-on .services,
      html.intro-on .caption,
      html.intro-on .group h2,
      html.intro-on ol.list li,
      html.intro-on #stage {
        opacity: 0;
      }

      /* ---- Cabecera ---- */

      .top {
        position: fixed;
        z-index: 10;
        top: 0;
        left: 0;
        right: 0;
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: 0 16px;
        align-items: center;
        padding: 16px var(--gutter);
        /* Arriba del todo, transparente. Al bajar se esconde y al subir vuelve
           con un negro translúcido y una línea finísima, sin tapar ni mezclarse. */
        transition:
          transform 0.6s cubic-bezier(0.25, 1, 0.5, 1),
          background-color 0.4s,
          box-shadow 0.4s;
      }

      html.scrolled .top {
        background-color: rgba(0, 0, 0, 0.72);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.08);
      }

      .top.away {
        transform: translateY(-100%);
      }

      .logo {
        grid-column: 1 / span 2;
        display: inline-flex;
        width: max-content;
      }

      .logo img {
        display: block;
        width: 52px;
        height: auto;
      }

      .role {
        grid-column: 3 / span 4;
        margin: 0;
        text-transform: none;
      }

      .nav {
        grid-column: 7 / span 3;
        display: flex;
        gap: 22px;
      }

      .end {
        grid-column: 10 / span 3;
        justify-self: end;
        display: flex;
        gap: 26px;
      }

      .lang {
        padding: 0;
        background: none;
        border: 0;
        cursor: pointer;
        letter-spacing: 0.04em;
      }

      /* El texto sube y entra otra copia desde abajo. */
      .roll {
        position: relative;
        display: inline-flex;
        overflow: hidden;
        font-size: 15.8px;
        line-height: 1.6;
      }

      .roll span {
        display: block;
        transition: transform 0.45s var(--ease);
      }

      .roll span + span {
        position: absolute;
        left: 0;
        top: 0;
        transform: translateY(100%);
      }

      .roll:hover span:first-child {
        transform: translateY(-100%);
      }

      .roll:hover span + span {
        transform: none;
      }

      /* ---- Primera pantalla ---- */

      .hero {
        position: relative;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: 0 16px;
        padding: 84px var(--gutter) var(--gutter);
      }

      .stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      /* Proporciones de la web de Jeremy: el párrafo crece por escalones (28,
         32 y 36 rem de ancho) y la letra va de 24 a 32 px. */
      .lead {
        position: relative;
        grid-column: 1 / span 6;
        align-self: end;
        max-width: 28rem;
      }

      .statement {
        margin: 0;
        font-size: clamp(1.5rem, 2.5vw, 2rem);
        line-height: 1.2;
        text-wrap: pretty;
      }

      .statement .arrow {
        display: inline-block;
        margin-right: 0.7em;
      }

      /* El empujón para escribirme: subrayado fino que se ilumina. */
      .cta {
        margin-top: 20px;
        padding-bottom: 3px;
        box-shadow: inset 0 -1px 0 var(--rule);
        transition: box-shadow 0.3s var(--ease);
      }

      .cta:hover {
        box-shadow: inset 0 -1px 0 var(--ink);
      }

      .services {
        margin: 2px 0 0;
        font-size: 15.8px;
        color: var(--ink-soft);
        /* Si no cabe en una línea, que las dos queden parejas. */
        text-wrap: balance;
      }

      .clock {
        display: flex;
        gap: 0.6em;
        margin: 22px 0 0;
        font-size: 15.8px;
        color: var(--ink-soft);
      }

      .time {
        display: inline-flex;
      }

      .time > span {
        position: relative;
        display: inline-block;
        overflow: hidden;
        min-width: 0.55em;
        text-align: center;
      }

      .time > span > span {
        display: block;
      }

      /* Como en la web de Jeremy: la cifra nueva sube desenfocada en 0,6 s y los
         dos puntos se apagan del todo y se encienden cada 0,65 s. */
      .time > span > span.new {
        animation: digit 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .time .colon {
        animation: blink 1.3s step-end infinite;
      }

      @keyframes digit {
        from {
          opacity: 0;
          filter: blur(3px);
          transform: translateY(100%);
        }
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      /* La columna de proyectos tiene ancho propio, pegada a la derecha:
         450 px, 500 desde 1024 de ancho y 600 desde 1280, como en la de Jeremy. */
      .side {
        position: relative;
        grid-column: 7 / -1;
        justify-self: end;
        width: min(100%, 450px);
        display: flex;
        flex-direction: column;
        min-height: 0;
        scroll-margin-top: 70px;
      }

      /* El hueco donde viven los puntos: todo lo que sobra encima de las listas. */
      .slot {
        flex: 1 1 auto;
        min-height: 230px;
      }

      /* Sitio fijo para título, dos líneas y enlaces: al aparecer no empuja nada. */
      .caption {
        margin: 0 0 18px;
        min-height: 6.7em;
        max-width: 34rem;
        font-size: 14px;
        line-height: 1.5;
        color: var(--ink-soft);
      }

      .caption b {
        display: block;
        margin-bottom: 2px;
        font-weight: 500;
        color: var(--ink);
      }

      /* Los enlaces de cada proyecto viven aquí y no en la fila: tocar una fila
         sólo cambia el dibujo, nunca te saca de la web sin querer. */
      .caption .links {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 16px;
        margin-top: 8px;
      }

      .caption .links a {
        color: var(--ink);
        box-shadow: inset 0 -1px 0 var(--rule);
        transition: box-shadow 0.25s;
      }

      .caption .links a:hover {
        box-shadow: inset 0 -1px 0 var(--ink);
      }

      .caption .links .soon {
        color: var(--ink-faint);
      }

      .caption.in {
        animation: rise 0.45s var(--ease) both;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }

      .group + .group {
        margin-top: 32px;
      }

      .group h2 {
        margin: 0 0 16px;
        font-weight: 400;
        color: var(--ink-soft);
      }

      ol.list {
        margin: 0;
        padding: 0;
        list-style: none;
        border-bottom: 1px solid var(--rule);
      }

      ol.list li {
        border-top: 1px solid var(--rule);
      }

      .row {
        position: relative;
        width: 100%;
        margin: 0;
        padding: 12px 10px;
        display: grid;
        grid-template-columns: 1fr auto 1.2rem;
        align-items: center;
        gap: 14px;
        text-align: left;
        font: inherit;
        background: none;
        border: 0;
        cursor: pointer;
        isolation: isolate;
        transition: color 0.3s var(--ease);
      }

      /* El blanco crece de abajo arriba al pasar por encima. */
      .row::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        background: var(--ink);
        transform: scaleY(0);
        transform-origin: bottom;
        transition: transform 0.35s var(--ease);
      }

      .row .name {
        font-size: clamp(0.875rem, 1.1vw, 1rem);
        line-height: 1.4;
      }

      .row .tag {
        font-family: var(--mono);
        font-size: 12px;
        text-transform: uppercase;
        color: var(--ink-faint);
        transition: color 0.3s;
      }

      .row .go {
        font-size: 15px;
        text-align: right;
      }

      .row.on {
        color: var(--bg);
      }

      .row.on::before {
        transform: none;
      }

      .row.on .tag {
        color: rgba(0, 0, 0, 0.5);
      }

      /* ---- Segunda pantalla: el retrato grande ---- */

      .about {
        position: relative;
        height: 100vh;
        height: 100svh;
        min-height: 560px;
        overflow: hidden;
        scroll-margin-top: 0;
      }

      .about canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
      }

      /* La palabra va detrás del personaje, como en Bloub. */
      .about .big {
        z-index: 0;
      }

      .panel {
        position: relative;
        z-index: 2;
        width: min(270px, 100%);
        /* Abajo, el hueco que dejaba «Hecho en Granada»: el negro se queda igual. */
        padding: 120px 0 38px var(--gutter);
      }

      .panel h2 {
        margin: 0 0 10px;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0;
      }

      .panel h2:not(:first-child) {
        margin-top: 28px;
      }

      .choices {
        display: grid;
        gap: 6px;
      }

      .choice {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 36px;
        padding: 0 12px;
        font-size: 13.5px;
        color: var(--ink-soft);
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--rule);
        border-radius: 8px;
        cursor: pointer;
        transition: color 0.2s, border-color 0.2s, background-color 0.2s;
      }

      .choice:hover {
        color: var(--ink);
        border-color: rgba(255, 255, 255, 0.35);
      }

      .choice[aria-pressed='true'] {
        color: var(--ink);
        border-color: rgba(255, 255, 255, 0.7);
      }

      .choice .mark {
        font-size: 12px;
      }

      /* El botón del juego de Sprite Fusion, tal cual lo dan ellos. */
      .panel .play h2 {
        margin-top: 28px;
      }

      .panel .destroy {
        display: inline-block;
        opacity: 0.85;
        transition: opacity 0.2s, transform 0.3s var(--ease);
      }

      .panel .destroy:hover {
        opacity: 1;
        transform: translateY(-1px);
      }

      .panel .destroy img {
        display: block;
      }

      /* Su juego necesita pantalla grande: en móvil no se ofrece. */
      @media (max-width: 880px), (hover: none) {
        .panel .play {
          display: none;
        }
      }

      /* La palabra enorme, cortada por abajo y apagándose hacia el suelo. */
      .big {
        position: absolute;
        left: calc(var(--gutter) * 2.4);
        bottom: -0.1em;
        margin: 0;
        font-size: clamp(120px, 19vw, 330px);
        font-weight: 800;
        line-height: 0.78;
        letter-spacing: -0.045em;
        color: transparent;
        background: linear-gradient(rgba(255, 255, 255, 0.26) 0%, rgba(255, 255, 255, 0.11) 48%, rgba(255, 255, 255, 0) 88%);
        -webkit-background-clip: text;
        background-clip: text;
        pointer-events: none;
        user-select: none;
      }

      @media (min-width: 1024px) {
        .lead {
          max-width: 32rem;
        }
        .side {
          width: min(100%, 500px);
        }
      }

      @media (min-width: 1280px) {
        .lead {
          max-width: 36rem;
        }
        .side {
          width: min(100%, 600px);
        }
      }

      @media (min-width: 1536px) {
        :root {
          --gutter: 128px;
        }
      }

      /* ---- Portátiles bajos: todo sigue cabiendo en una pantalla ---- */

      @media (min-width: 881px) and (max-height: 999px) {
        .hero {
          padding-top: 72px;
        }
        .slot {
          min-height: 190px;
        }
        .caption {
          margin-bottom: 12px;
        }
        .group + .group {
          margin-top: 18px;
        }
        .group h2 {
          margin-bottom: 8px;
        }
        .row {
          padding: 7px 10px;
        }
      }

      @media (min-width: 881px) and (min-height: 1000px) and (max-height: 1120px) {
        .row {
          padding: 10px 10px;
        }
        .group + .group {
          margin-top: 26px;
        }
      }

      /* ---- Pantallas estrechas ---- */

      @media (max-width: 880px) {
        .top {
          display: flex;
          justify-content: space-between;
          padding: max(14px, env(safe-area-inset-top)) 20px 14px;
        }
        .role,
        .nav {
          display: none;
        }
        .end {
          gap: 20px;
        }
        .logo img {
          height: 26px;
        }
        .hero {
          display: flex;
          flex-direction: column;
          padding: 70px 20px 36px;
        }
        /* En móvil: primero la cara en puntos, luego la descripción y después
           los proyectos. La columna se deshace para poder ordenar sus piezas. */
        .side {
          display: contents;
        }
        .slot {
          order: 1;
        }
        .caption {
          order: 3;
        }
        #lists {
          order: 4;
        }
        .slot {
          flex: none;
          height: 38svh;
          min-height: 240px;
        }
        .caption {
          min-height: 0;
          margin-bottom: 18px;
          font-size: 13px;
        }
        /* Vacía no ocupa sitio: los proyectos suben pegados a la descripción. */
        .caption:empty {
          margin: 0;
        }
        .group + .group {
          margin-top: 22px;
        }
        .group h2 {
          margin-bottom: 8px;
          font-size: 12px;
        }
        .row {
          padding: 11px 6px;
        }
        .row .name {
          font-size: 15px;
        }
        .lead {
          order: 2;
          margin: 4px 0 30px;
        }
        .statement {
          font-size: 23px;
        }
        .clock {
          font-size: 14px;
        }
        .services {
          font-size: 12px;
          letter-spacing: -0.01em;
        }
        /* Sin alto fijo: MARIO queda justo debajo de los enlaces, sin hueco. */
        .about {
          height: auto;
          min-height: 0;
          padding-bottom: calc(24vw + 40px);
        }
        /* Debajo de la bolita: 84 px de arriba + su diámetro (57 % del ancho). */
        .panel {
          padding: calc(84px + 57vw + 44px) 20px 38px;
          width: 100%;
        }
        .panel .contact-choices {
          grid-template-columns: 1fr 1fr 1fr;
        }
        .big {
          left: 14px;
          font-size: 31vw;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        .caption.in,
        .time > span > span.new,
        .time .colon {
          animation: none;
        }
      }

      noscript .fallback {
        position: fixed;
        inset: 0;
        z-index: 200;
        overflow: auto;
        padding: 40px var(--gutter);
        background: var(--bg);
      }
    </style>
  </head>
  <body>
    <div class="intro" id="intro" aria-hidden="true"><p id="intro-word"></p></div>

    <header class="top">
      <a class="logo" href="#inicio" aria-label="Mario Montecatine, inicio"><img src="assets/logo.png" alt="" width="59" height="30" /></a>
      <p class="role mono" id="role"></p>
      <nav class="nav" id="nav" aria-label="Secciones"></nav>
      <div class="end">
        <button class="lang roll" id="lang" type="button"></button>
        <a class="contact roll" id="contact" href="mailto:mario@focco.app"></a>
      </div>
    </header>

    <main>
      <section class="hero" id="inicio">
        <canvas id="stage" class="stage" aria-hidden="true"></canvas>

        <div class="lead">
          <p class="statement"><span class="arrow" aria-hidden="true">(→)</span><span id="statement"></span></p>
          <a class="cta roll" id="cta" href="mailto:mario@focco.app"></a>
          <p class="clock mono"><span class="time" id="time" aria-label=""></span><span id="place"></span></p>
          <p class="services mono" id="services"></p>
        </div>

        <div class="side" id="proyectos">
          <div class="slot" id="slot"></div>
          <p class="caption" id="caption" aria-live="polite"></p>
          <div id="lists"></div>
        </div>
      </section>

      <section class="about" id="sobre-mi">
        <canvas id="focco" aria-hidden="true"></canvas>
        <div class="panel" id="panel"></div>
        <p class="big" id="big" aria-hidden="true"></p>
      </section>
    </main>

    <noscript>
      <div class="fallback">
        <h1>Mario Montecatine</h1>
        <p>De la ciudad de la Alhambra. He estudiado Ingeniería en Telecomunicaciones en la UGR. Ahora construyo *****, un dispositivo para recuperar la atención.</p>
        <p>
          <a href="https://github.com/mariomontecatine">GitHub</a> ·
          <a href="https://es.linkedin.com/in/mariomontecatine">LinkedIn</a> ·
          <a href="mailto:mario@focco.app">mario@focco.app</a>
        </p>
      </div>
    </noscript>

    <script type="module" src="main.js"></script>
  </body>
</html>
